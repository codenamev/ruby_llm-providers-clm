name: CI

on:
  pull_request:
  push:
    branches: [main]
  # RubyLLM main moves under us, so check against it on a schedule too.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: tests (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Doubles and the mock engine stand in for the model, so no GPU or checkpoint is needed.
      - run: bundle exec rake test
